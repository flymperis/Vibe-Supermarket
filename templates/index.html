<!doctype html>
<html lang="el">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Ψώνια</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ψώνια">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7f6">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1f1f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/static/styles.css?v={{ v }}">
    <script>
        // Apply the saved theme before first paint so there's no flash.
        (function () {
            var t = localStorage.getItem("theme");
            if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        })();
    </script>
</head>
<body>
<div id="app">
    <!-- ================================================================ LIST -->
    <section class="view" id="view-list" data-view="list">
        <header class="topbar">
            <div class="topbar-row">
                <div>
                    <h1>Λίστα</h1>
                    <p class="subtitle" id="list-summary">&nbsp;</p>
                </div>
                <div class="topbar-actions">
                    <span class="sync-dot" id="sync-dot" title="Συγχρονισμός"></span>
                    <button class="icon-btn" data-open-settings aria-label="Ρυθμίσεις">
                        <svg><use href="#i-settings"/></svg>
                    </button>
                </div>
            </div>
            <button class="searchbar fake" data-open-search>
                <svg><use href="#i-search"/></svg>
                <span>Τι χρειαζόμαστε;</span>
            </button>
        </header>
        <div class="content" id="list-content"></div>
    </section>

    <!-- ================================================================ FREQUENT -->
    <section class="view" id="view-frequent" data-view="frequent" hidden>
        <header class="topbar">
            <div class="topbar-row">
                <div>
                    <h1>Συχνά</h1>
                    <p class="subtitle">Αγαπημένα, συνήθη και δικά μας</p>
                </div>
            </div>
            <button class="searchbar fake" data-open-search>
                <svg><use href="#i-search"/></svg>
                <span>Αναζήτηση προϊόντος</span>
            </button>
        </header>
        <div class="content" id="frequent-content"></div>
    </section>

    <!-- ================================================================ CATALOG -->
    <section class="view" id="view-catalog" data-view="catalog" hidden>
        <header class="topbar">
            <div class="topbar-row">
                <button class="icon-btn back" id="catalog-back" hidden aria-label="Πίσω">
                    <svg><use href="#i-back"/></svg>
                </button>
                <div class="grow">
                    <h1 id="catalog-title">Κατάλογος</h1>
                    <p class="subtitle" id="catalog-subtitle">&nbsp;</p>
                </div>
            </div>
            <button class="searchbar fake" data-open-search>
                <svg><use href="#i-search"/></svg>
                <span>Αναζήτηση σε όλο τον κατάλογο</span>
            </button>
        </header>
        <div class="content" id="catalog-content"></div>
    </section>

    <!-- ================================================================ BOTTOM NAV -->
    <nav class="tabbar">
        <button data-tab="list" class="active">
            <svg><use href="#i-list"/></svg><span>Λίστα</span><b class="badge" id="tab-badge" hidden></b>
        </button>
        <button data-tab="frequent">
            <svg><use href="#i-star"/></svg><span>Συχνά</span>
        </button>
        <button data-tab="catalog">
            <svg><use href="#i-grid"/></svg><span>Κατάλογος</span>
        </button>
    </nav>
</div>

<!-- ================================================================ SEARCH OVERLAY -->
<div class="overlay" id="search" hidden>
    <header class="topbar">
        <div class="search-row">
            <label class="searchbar">
                <svg><use href="#i-search"/></svg>
                <input id="search-input" type="search" enterkeyhint="done" autocomplete="off"
                       autocorrect="off" spellcheck="false" placeholder="π.χ. γάλα, ντομάτες, φέτα">
                <button class="clear" id="search-clear" aria-label="Καθαρισμός" hidden><svg><use href="#i-x"/></svg></button>
            </label>
            <button class="text-btn" id="search-close">Τέλος</button>
        </div>
    </header>
    <div class="content" id="search-content"></div>
</div>

<!-- ================================================================ SHEETS -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
</div>

<div class="toast" id="toast" hidden>
    <span id="toast-text"></span>
    <button id="toast-action" hidden></button>
</div>

<!-- ================================================================ ICONS (lucide-style) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></symbol>
        <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
        <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></symbol>
        <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></symbol>
        <symbol id="i-tag" viewBox="0 0 24 24"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.5"/></symbol>
    </defs>
</svg>

<script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
